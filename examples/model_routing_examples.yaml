    language: "zh"
    preferred_models: ["kling", "sora"]
    selected_model: "kling"
    reason: "可灵模型对东方意境理解佳，适合城市宣传"
  
  # 提示词优化
  optimized_prompt: |
    延时摄影，上海外滩夜景，东方明珠塔灯光璀璨，
