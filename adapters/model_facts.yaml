# 模型事实单一数据源（Single Source of Truth）
#
# 硬事实只在这里改：时长上限、分辨率、参考输入上限、多镜头、音频、语言。
# 其他文件（12-kling-capability-map.md、adapters/kling_adapter.yaml、
# adapters/model_router.yaml、根 SKILL.md 的 Model Gate 表）与这里冲突时，
# 以这里为准，并把冲突文件改到与这里一致，不要反过来改这里去迁就旧文件。
#
# 口径说明（重要）：
# - scope: official 指模型官方能力口径；channel 指具体接入渠道
#   （官方 App / API / 第三方平台）实际开放的档位，渠道之间不一样。
# - 凡 channel_dependent: true 的字段，写 prompt 前要在所用渠道再确认一次，
#   不要把官方上限当成当前渠道一定能选的档位。
# - 经验判断（哪类镜头更适合哪个模型）不放这里，放 12 和根 SKILL.md，
#   这里只放能被规格和实测核对的事实。
#
# 维护规则：
# - 改任何字段，必须同时改 verified_at 和在字段下补 source 说明。
# - 超过 60 天没复核的字段视为待核实，使用时先提醒用户。

meta:
  version: "1.1.0"
  verified_at: "2026-10-30"
  verified_by: "仓库内三处口径交叉对齐（router / 根 SKILL Model Gate / capability-map）+ 公开页面多源一致项；1.1.0 增补 Kling 4.0（官方发布口径多家报道一致 + fal kling/v4 端点 Input Schema 交叉核对）与 Seedance 2.5 的 fal 渠道状态"
  unverified_note: "Kling 4.0 的 4K/HDR 为官方 coming soon、10+ 对白语种清单未逐项核实；Seedance 2.5 官方直连 API 状态仍未核实（fal 渠道已确认可用）；Runway/Sora/Pika 不在本表，状态见文末 planned 一节。"

models:
  kling_3_0:
    family: "kling"
    display_name: "Kling 3.0"
    provider: "Kuaishou"
    scope: official
    duration_s: { min: 3, max: 15 }
    resolution_max: "4K"
    channel_dependent: true
    channel_note: "4K 与 15s 是否可选取决于渠道和档位，第三方平台常见上限是 1080p。"
    aspect_ratios: ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3", "21:9"]
    multi_shot: { supported: true, max_shots: 6 }
    native_audio: true
    dialogue_languages: ["zh", "en", "ja", "ko", "es"]
    native_text_rendering: true
    reference_inputs: { images_max: 7, note: "主体参考 1-7 图，见 kling_3_0_omni 的视频角色提取" }
    status: "active"

  kling_3_0_omni:
