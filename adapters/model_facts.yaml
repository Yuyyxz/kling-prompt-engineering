    scope: official
    duration_s: { min: 3, max: 15 }
    resolution_max: "1080p"
    channel_dependent: true
    multi_shot: { supported: true, max_shots: 6, custom_storyboard: true }
    native_audio: true
    voice_binding: true
    video_character_extraction: { supported: true, source_clip_s: "3-8" }
    status: "active"

  kling_4_0:
    family: "kling"
    display_name: "Kling 4.0"
    provider: "Kuaishou"
    scope: official
    released: "2026-10-16 全球开放（4.0 Flash 于 2026-09-28 先行限量，Flash 未上 API）"
    duration_s: { min: 3, max: 30 }
    resolution_max: "1080p"
    channel_dependent: true
    channel_note: "官方称 4K 与 10-bit HDR 为 coming soon、尚未交付，不要按 4K 写交付承诺；fal 端点当前 720p/1080p、画幅 16:9/9:16/1:1/21:9；官方直连 API 仍是 early access，第三方多走 fal 等渠道。"
    aspect_ratios: ["16:9", "9:16", "1:1", "21:9"]
    multi_shot: { supported: true, max_shots: 6, note: "fal 端点用 multi_prompt 逐镜给 prompt、总时长为各镜之和；镜数上限官方未单独公布，6 为渠道实测口径，超了先在渠道确认" }
    keyframes: { max: 10, note: "关键帧可放在时间线任意位置；渠道口径为首帧 + 最多 8 个中间帧 + 尾帧" }
    native_audio: true
    stereo_audio: true
    dialogue_languages: ["zh", "en", "ja", "ko", "es"]
    dialogue_note: "官方称口型同步支持 10+ 语种与方言，上列 5 种沿用 3.0 已确认清单，完整清单未逐项核实。"
    native_text_rendering: true
    prompt_max_tokens: 8000
    reference_inputs: { images_max: 10, videos_max: 5, videos_total_s: 30, elements_max: 7, combined_max: 15, addressing: "prompt 里用 @ImageN / @ElementN 指名素材分工" }
    features: ["Creative Recreation（拿现成视频当模板换角色/产品）", "元素级定向编辑（表情/动作/机位/背景单独改）", "视频延长总长可达约 2 分钟", "白模/深度图视频可作参考（3D 代理）"]
    status: "active"
    source: "Kling 官方发布口径（2026-10-16 全球开放）经多家独立报道一致 + fal kling/v4 端点 Input Schema（duration 3-30、multi_prompt、720p/1080p、画幅四种）交叉核对，2026-10-30"

