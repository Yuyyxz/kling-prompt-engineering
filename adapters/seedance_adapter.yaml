# Seedance 模型适配器
# 字节跳动视频生成模型专属配置
# 基于 GitHub 高星仓库最佳实践优化

# 导演引擎集成（P0 优先级）
director_engine:
  enabled: true
  skill_ref: "skills/director-engine.skill"
  description: "从意图推导到技术执行的导演式视频生成引擎"
  
  # 导演五问（每次生成前必须回答）
  director_questions:
    - "功能 (Function): 这个场景在故事中做什么？"
    - "转折 (Turn): 价值反转是什么？"
    - "视角 (Perspective): 我们在谁的体验里？"
    - "权力 (Power): 谁持有权力，如何流动？"
    - "潜台词 (Subtext): 什么是真实但未说出的？"
  
  # 黄金公式更新
  golden_formula: "[场景意图/戏剧功能] + [一个可见节拍] + [一个镜头运动] + [真实光源] + [参考角色绑定]"

# 时间轴格式集成（P0 优先级）
timeline_format:
  enabled: true
  skill_ref: "skills/timeline-format.skill"
  description: "时间轴格式提示词生成器"
  
  # 时间轴结构
  structure: |
    [风格描述]，[画幅比例]，[色调]
    
    0-3秒画面：[开场描述]
    3-6秒画面：[主体引入]
    6-9秒画面：[情节发展]
    9-12秒画面：[高潮时刻]
    12-15秒画面：[结尾落版]
    
    【声音】[配乐风格] + [音效] + [对白]
    【参考】[素材引用]

model_id: "seedance"
model_name: "Seedance 2.0"
provider: "ByteDance"
version: "2.0"
description: "字节跳动视频生成模型，支持四模态输入（文本+图片+视频+音频），擅长中文语境和动态场景"

# 模型能力配置
capabilities:
  max_duration: "15s"
  min_duration: "2s"
  aspect_ratios: ["16:9", "9:16", "1:1"]
  max_resolution: "720p"
  fps: 24
  supports_image_input: true
  max_images: 9
  supports_video_input: true
  max_videos: 3
  max_video_total_duration: "15s"
  supports_audio_input: true
  max_audios: 3
  max_audio_duration: "15s"
  max_total_files: 12
  supports_sound_output: true

# 素材引用语法（@ 语法）
reference_syntax:
  # 图片引用
  image_references:
    - "@image1"
    - "@image2"
    - "@image3"
    - "@image4"
    - "@image5"
    - "@image6"
    - "@image7"
    - "@image8"
    - "@image9"
  
  # 视频引用
  video_references:
    - "@video1"
    - "@video2"
    - "@video3"
  
  # 音频引用
  audio_references:
    - "@audio1"
    - "@audio2"
    - "@audio3"
  
  # 使用示例
  usage_example: |
    【参考】@image1 角色参考，@image2 场景参考，@video1 动作参考

# 素材编号规范
material_naming:
  # 角色素材
  character:
    prefix: "C"
    range: "C01-C99"
    description: "角色（多角度）"
    example: "C01 林冲·正面全身"
  
  # 场景素材
  scene:
    prefix: "S"
    range: "S01-S99"
    description: "场景/地点"
    example: "S01 沧州草料场·雪景"
  
  # 道具素材
  prop:
    prefix: "P"
    range: "P01-P99"
    description: "道具/物品"
    example: "P01 长枪"

# 时间轴格式提示词
timeline_format:
  # 时间轴结构
  structure: |
    [风格描述]，[画幅比例]，[色调]
    
    0-3秒画面：[开场描述]
    3-6秒画面：[主体引入]
    6-9秒画面：[情节发展]
    9-12秒画面：[高潮时刻]
    12-15秒画面：[结尾落版]
    
    【声音】[配乐风格] + [音效] + [对白]
    【参考】[素材引用]
  
  # 时间轴示例
  example: |
    水墨武侠风格，9:16竖屏，灰白墨黑色调
    
    0-3秒画面：高空俯拍，场景建立
    3-6秒画面：镜头推进，主体引入
    6-9秒画面：情节发展，冲突展现
    9-12秒画面：高潮时刻，情感爆发
    12-15秒画面：结尾落版，氛围延续
    
    【声音】古筝配乐 + 风声 + 脚步声
    【参考】@image1 角色参考，@image2 场景参考

# 2 秒钩子框架（社交媒体必备）
hook_framework:
  description: "前 2 秒必须抓住观众注意力，防止滑动"
  
  # 10 种开场模式
  hook_patterns:
    - name: "悬念开场"
      description: "展示一个未完成的动作"
      example: "一把剑悬在半空，即将落下"
    
    - name: "冲突开场"
      description: "两个对立元素的碰撞"
      example: "火焰与冰霜相遇"
    
    - name: "反转开场"
      description: "预期与现实的对比"
      example: "看似平静的湖面，突然巨浪翻涌"
    
    - name: "特写开场"
      description: "极端近景展示细节"
      example: "眼睛的特写，瞳孔中倒映出火焰"
    
    - name: "运动开场"
      description: "快速移动吸引注意力"
      example: "一辆赛车从画面左侧冲入"
    
    - name: "光影开场"
      description: "强烈的明暗对比"
      example: "黑暗中一束光照亮主角"
    
    - name: "声音开场"
      description: "引人注意的音效"
      example: "尖锐的警报声响起"
    
    - name: "文字开场"
      description: "引人注目的文字"
      example: "大字幕：'3秒后，一切改变'"
    
    - name: "对比开场"
      description: "大小、快慢、动静的对比"
      example: "巨大的机器人与渺小的人类"
    
    - name: "情感开场"
      description: "强烈的情感表达"
      example: "主角流下一滴眼泪"
  
  # 钩子模板
  hook_template: |
    前2秒：[钩子模式]，[具体描述]
    目的：让观众停止滑动

# 提示词优化规则
prompt_optimization:
  # 语言偏好
  language_preference: "zh"
  
  # 提示词结构（黄金公式）
  golden_formula: "[镜头语言] + [主体动作与细节] + [环境氛围] + [光影与画质] + [运动轨迹]"
  
  # 时间轴格式结构
  timeline_structure:
    - "风格描述"
    - "画幅比例"
    - "色调"
    - "0-3秒画面：开场"
    - "3-6秒画面：主体引入"
    - "6-9秒画面：情节发展"
    - "9-12秒画面：高潮"
    - "12-15秒画面：结尾"
    - "声音设计"
    - "素材引用"
  
  # 推荐的提示词长度
  recommended_length: "150-300 字符"
  max_length: "300 字符"
  
  # 避免的提示词模式
  avoid_patterns:
    - "过于抽象的描述"
    - "复杂的否定句式"
    - "矛盾的指令"
    - "过多的形容词堆砌"
    - "超过 300 字的复杂提示词"

# 视频延长功能（多集连续）
video_extension:
  description: "使用视频延长功能保持多集视频的连续性"
  
  # 延长语法
  extension_syntax: "将@视频1延长15s"
  
  # 工作流程
  workflow: |
    1. 生成第一集视频
    2. 从第二集开始，上传上一集视频作为 @视频1
    3. 在提示词开头添加：将@视频1延长15s
    4. 这样可以创建各集间的无缝过渡
  
  # 延长示例
  example: |
    将@视频1延长15s
    
    水墨武侠风格，9:16竖屏，灰白墨黑色调
    
    0-3秒画面：承接上一集结尾
    3-6秒画面：新的情节发展
    6-9秒画面：冲突升级
    9-12秒画面：高潮时刻
    12-15秒画面：悬念结尾
    
    【声音】延续上一集配乐风格
    【参考】@视频1 上一集视频

# 运镜关键词库
camera_movements:
  # 推拉镜头
  push_pull:
    - keyword: "推镜头"
      description: "镜头向前推进"
    - keyword: "缓慢推近"
      description: "缓慢向前推进"
    - keyword: "急速推进"
      description: "快速向前推进"
    - keyword: "拉镜头"
      description: "镜头向后拉远"
    - keyword: "逐渐拉远"
      description: "缓慢向后拉远"
  
  # 左右移动
  pan:
    - keyword: "左摇"
      description: "镜头向左旋转"
    - keyword: "右摇"
      description: "镜头向右旋转"
    - keyword: "横移"
      description: "镜头水平移动"
  
  # 跟随镜头
  tracking:
    - keyword: "跟随镜头"
      description: "镜头跟随主体移动"
    - keyword: "跟拍"
      description: "持续跟随主体拍摄"
  
  # 环绕镜头
  orbit:
    - keyword: "环绕镜头"
      description: "镜头围绕主体旋转"
    - keyword: "360度旋转"
      description: "完整环绕主体一圈"
  
  # 升降镜头
  vertical:
    - keyword: "升镜头"
      description: "镜头向上移动"
    - keyword: "降镜头"
      description: "镜头向下移动"
    - keyword: "俯冲"
      description: "镜头快速向下俯冲"
  
  # 特殊运镜
  special:
    - keyword: "希区柯克变焦"
      description: "推拉镜头同时变焦，产生眩晕效果"
    - keyword: "一镜到底"
      description: "全程无剪辑的连续镜头"
    - keyword: "手持晃动"
      description: "手持拍摄的轻微晃动效果"

# 特定领域的优化参数
domain_optimization:
  # 知识口播优化
  knowledge_avatar:
    prompt_template: |
      [风格描述]，[画幅比例]，[色调]
      
      0-3秒画面：人物出场，建立镜头
      3-6秒画面：人物开始讲话，口型同步
      6-9秒画面：重点内容展示
      9-12秒画面：情感表达
      12-15秒画面：总结落版
      
      【声音】清晰人声 + 轻柔背景音乐
      【参考】@image1 人物参考
    constraints:
      - "面部无遮挡"
      - "双眼间距占画面宽度≥25%"
      - "保持人物正脸朝向镜头"
      - "避免剧烈头部运动"
      - "口型同步"

  # 影视广告优化
  cinematic_ad:
    prompt_template: |
      [风格描述]，[画幅比例]，[色调]
      
      0-3秒画面：产品特写，材质展示
      3-6秒画面：产品使用场景
      6-9秒画面：功能亮点展示
      9-12秒画面：情感共鸣
      12-15秒画面：品牌落版
      
      【声音】品牌音乐 + 产品音效
      【参考】@image1 产品参考，@image2 场景参考
    constraints:
      - "突出产品细节和质感"
      - "使用电影级光线"
      - "避免塑料感材质"
      - "保持画面稳定性"

  # 叙事短剧优化
  narrative_story:
    prompt_template: |
      [风格描述]，[画幅比例]，[色调]
      
      0-3秒画面：场景建立，氛围营造
      3-6秒画面：角色出场，关系建立
      6-9秒画面：情节发展，冲突展现
      9-12秒画面：高潮时刻，情感爆发
      12-15秒画面：悬念结尾，期待下一集
      
      【声音】剧情配乐 + 环境音 + 对白
      【参考】@image1 角色参考，@image2 场景参考
    constraints:
      - "保持角色一致性"
      - "场景转换自然"
      - "情感表达准确"
      - "避免角色变形"
      - "为下一集留下悬念"

  # 电商广告优化
  ecommerce_ad:
    prompt_template: |
      [风格描述]，[画幅比例]，[色调]
      
      0-3秒画面：2秒钩子，吸引注意力
      3-6秒画面：产品展示，核心卖点
      6-9秒画面：使用场景，效果展示
      9-12秒画面：用户评价，社会证明
      12-15秒画面：促销信息，行动号召
      
      【声音】动感音乐 + 产品音效
      【参考】@image1 产品参考
    constraints:
      - "前2秒必须抓眼球"
      - "突出产品核心卖点"
      - "包含促销信息"
      - "引导购买行为"

  # 动漫风格优化
  anime:
    prompt_template: |
      [风格描述]，[画幅比例]，[色调]
      
      0-3秒画面：角色出场，动态展示
      3-6秒画面：技能释放，特效展示
      6-9秒画面：战斗场面，动作流畅
      9-12秒画面：情感表达，内心独白
      12-15秒画面：悬念结尾，期待下一集
      
      【声音】动漫配乐 + 音效 + 声优配音
      【参考】@image1 角色参考
    constraints:
      - "保持动漫风格一致性"
      - "动作流畅自然"
      - "特效华丽但不杂乱"
      - "情感表达夸张但真实"

  # 音乐视频优化
  music_video:
    prompt_template: |
      [风格描述]，[画幅比例]，[色调]
      
      0-3秒画面：开场视觉，建立氛围
      3-6秒画面：歌手出场，表演开始
      6-9秒画面：副歌高潮，视觉爆发
      9-12秒画面：情感表达，故事穿插
      12-15秒画面：结尾落版，余韵延续
      
      【声音】音乐为主，画面配合节奏
      【参考】@image1 歌手参考，@audio1 音乐参考
    constraints:
      - "画面与音乐节奏同步"
      - "视觉效果配合歌曲情感"
      - "包含表演镜头和叙事镜头"
      - "结尾留有余韵"

