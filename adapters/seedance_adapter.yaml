# 平台优化
platform_optimization:
  # 抖音/TikTok
  douyin_tiktok:
    aspect_ratio: "9:16"
    orientation: "竖屏"
    duration: "15s"
    hook_importance: "极高"
    tips:
      - "前2秒必须抓眼球"
      - "节奏要快"
      - "包含热门话题标签"
      - "引导点赞评论"
  
  # Instagram Reels
  instagram_reels:
    aspect_ratio: "9:16"
    orientation: "竖屏"
    duration: "15s"
    hook_importance: "高"
    tips:
      - "视觉效果要精美"
      - "包含品牌元素"
      - "引导分享"
  
  # YouTube
  youtube:
    aspect_ratio: "16:9"
    orientation: "横屏"
    duration: "15s"
    hook_importance: "中"
    tips:
      - "画质要高"
      - "包含字幕"
      - "引导订阅"
  
  # B站
  bilibili:
    aspect_ratio: "16:9"
    orientation: "横屏"
    duration: "15s"
    hook_importance: "中"
    tips:
      - "内容要有深度"
      - "包含弹幕互动点"
      - "引导三连"

# 重要限制
limitations:
  # 输入限制
  input_limits:
    - "最多 9 张图片"
    - "最多 3 个视频（总时长 15 秒）"
    - "最多 3 个音频（总时长 15 秒）"
    - "合计最多 12 个文件"
    - "单个图片 < 30MB"
    - "单个视频 < 50MB"
    - "单个音频 < 15MB"
  
  # 输出限制
  output_limits:
    - "视频时长 4-15 秒"
    - "分辨率 720p"
    - "包含声音"
  
  # 提示词限制
  prompt_limits:
    - "复杂提示词（300+字）可能不一致"
    - "敏感词可能导致生成失败"
    - "视频编辑能力有限"
    - "大多数修改需要重新生成"
  
  # 敏感词规避
  sensitive_words:
    description: "平台不会明确告知哪个词触发屏蔽"
    solution: "使用二分法排查：将提示词分段测试，逐步缩小范围"
    common_sensitive_words:
      - "江湖人士"
      - "暴力血腥"
      - "政治敏感"
      - "色情暗示"

# 风格一致性策略
style_consistency:
  # 统一风格前缀
  style_prefix_example: "Chinese ink wash painting style mixed with anime cel-shading"
  
  # 角色辨识度
  character_recognition:
    method: "通过不同的颜色方案和视觉标记区分角色"
    example: "主角穿红衣，配角穿蓝衣"
  
  # 多角度参考图
  multi_angle_reference:
    description: "为每个角色生成多张不同角度和状态的参考图"
    angles:
      - "正面全身"
      - "侧面半身"
      - "背面全身"
      - "特写面部"
      - "动作姿态"

# 光影优化参数
lighting_optimization:
  # 推荐的光影模式
  recommended_lighting:
    - "自然光 (natural lighting)"
    - "电影级光线 (cinematic lighting)"
    - "戏剧性光线 (dramatic lighting)"
    - "柔光 (soft light)"
    - "环境光 (ambient light)"
    - "逆光 (backlight)"
    - "侧光 (side lighting)"
    - "顶光 (top lighting)"
    - "底光 (bottom lighting)"

  # 避免的光影模式
  avoid_lighting:
    - "过曝 (overexposed)"
    - "欠曝 (underexposed)"
    - "强烈的硬光 (harsh hard light)"
    - "不自然的色彩 (unnatural colors)"

# 画质优化参数
quality_optimization:
  # 推荐的画质描述
  recommended_quality:
    - "高清 (high definition)"
    - "720p"
    - "电影级 (cinematic)"
    - "写实 (photorealistic)"
    - "细节丰富 (highly detailed)"

  # 画质增强关键词
  enhancement_keywords:
    - "细节清晰 (sharp details)"
    - "色彩准确 (accurate colors)"
    - "无噪点 (noise-free)"
    - "专业级 (professional grade)"

# 错误处理与降级策略
error_handling:
  # 常见错误及解决方案
  common_errors:
    - error: "面部变形"
      solution: "增加'保持面部清晰'约束，减少面部区域的运动幅度"
    - error: "动作不自然"
      solution: "简化动作描述，使用更具体的动词"
    - error: "场景突变"
      solution: "增加场景描述的连贯性，使用过渡描述"
    - error: "光影失真"
      solution: "使用更具体的光影描述，避免抽象词汇"
    - error: "敏感词触发"
      solution: "使用二分法排查敏感词，积累敏感词库"
    - error: "提示词过长"
      solution: "简化提示词，控制在 300 字以内"
    - error: "视频延长不连贯"
      solution: "在提示词中显式添加转场指令"

  # 降级策略
  fallback_strategies:
    - "简化提示词结构"
    - "减少描述细节"
    - "使用更通用的词汇"
    - "降低画质要求"
    - "缩短视频时长"

# 性能优化
performance_optimization:
  # 生成速度优化
  speed_tips:
    - "使用简短的提示词"
    - "避免复杂的运镜指令"
    - "选择标准分辨率"
    - "使用推荐的时长范围"
    - "减少素材数量"

  # 质量优化
  quality_tips:
    - "提供详细的主体描述"
    - "使用具体的光影描述"
    - "包含画质关键词"
    - "避免矛盾的描述"
    - "使用时间轴格式"
    - "包含 2 秒钩子"

# 集成配置
integration:
  # API 配置
  api_config:
    endpoint: "https://api.seedance.com/v1"
    authentication: "api_key"
    rate_limit: "100 requests/hour"
    timeout: 300

  # 输出配置
  output_config:
    format: "mp4"
    quality: "high"
    metadata: true
    download_url: true

  # 回调配置
  callback_config:
    webhook_url: "${CALLBACK_URL}"
    events: ["generation_started", "generation_completed", "generation_failed"]

# 使用示例
usage_examples:
  # 示例 1：电影风格
  cinematic_example: |
    电影风格，16:9横屏，冷色调
    
    0-3秒画面：远景建立，孤独的城堡在雾中若隐若现
    3-6秒画面：镜头推进，城堡大门缓缓打开
    6-9秒画面：主角出场，背光剪影，神秘感
    9-12秒画面：特写面部，眼神坚定
    12-15秒画面：主角转身走向城堡深处
    
    【声音】史诗配乐 + 风声 + 脚步声
    【参考】@image1 角色参考，@image2 场景参考
  
  # 示例 2：电商广告
  ecommerce_example: |
    时尚电商风格，9:16竖屏，明亮色调
    
    0-3秒画面：2秒钩子，模特快速换装
    3-6秒画面：产品特写，材质细节
    6-9秒画面：使用场景，效果展示
    9-12秒画面：用户好评，社会证明
    12-15秒画面：促销信息，行动号召
    
    【声音】动感音乐 + 产品音效
    【参考】@image1 产品参考
  
  # 示例 3：动漫风格
  anime_example: |
    日本动漫风格，16:9横屏，鲜艳色调
    
    0-3秒画面：角色出场，动态展示
    3-6秒画面：技能释放，特效展示
    6-9秒画面：战斗场面，动作流畅
    9-12秒画面：情感表达，内心独白
    12-15秒画面：悬念结尾，期待下一集
    
    【声音】动漫配乐 + 音效 + 声优配音
    【参考】@image1 角色参考

