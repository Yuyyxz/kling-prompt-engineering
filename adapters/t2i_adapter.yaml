# 文生图模型适配器
# 三个主流 T2I 模型的 prompt 格式差异和翻译规则
# Kolors / Qwen Image 3 Pro / Seedream 5.0

version: "1.0"
description: "文生图多模型适配层——同一个创意意图，三个模型的 prompt 怎么写"

# ============================================================
# 模型注册表
# ============================================================
models:

  kolors:
    model_id: "kolors"
    model_name: "Kolors（可图）"
    provider: "Kuaishou"
    base_model: "ChatGLM3"
    description: "快手出品，中文理解最深，开源可本地部署"

    capabilities:
      max_prompt_length: "150 字中文（超过稀释权重）"
      optimal_prompt_length: "80-120 字中文"
      supported_languages: ["zh", "en（次要）"]
      text_rendering: "中文业界领先（招牌/对联/书法字）"
      controlnet: true
      ip_adapter: true
      lora: true
      reference_images: false
      negative_prompt: "独立参数，和正面 prompt 分开提交"

    prompt_format:
      formula: "[画面主体], [场景描述], [艺术风格], [光线色调], 高清, 精细, 专业品质"
      structure:
        - "主体（一句话讲清楚）"
        - "场景（在哪，什么环境）"
        - "风格（写实/国画/油画等）"
        - "光线（暖/冷/自然）"
        - "质量后缀（高清, 精细, 专业品质）"
      rules:
        - "简洁为王——长了反而稀释"
        - "中文描述为主，技术词可混英文"
        - "别写相机型号——Kolors 对镜头语言不敏感"
        - "质量词放结尾当后缀，别穿插在描述里"
      separator: "，（中文逗号）"
      max_detail_level: "中等——写多了它消化不了"

    strengths:
      - "中文语境场景理解最深"
      - "中文文字生成最强"
      - "开源本地部署唯一选项"
      - "和可灵视频同生态，I2V 首帧衔接最顺"

    weaknesses:
      - "长 prompt 权重稀释"
      - "英文场景理解弱于纯英文模型"
      - "相机/镜头语言不敏感"

    best_for:
      - "中国文化场景"
      - "含中文文字的图片"
      - "视频首帧（I2V 衔接）"
      - "开源本地部署"

  qwen_image:
    model_id: "qwen_image_3_pro"
    model_name: "Qwen Image 3 Pro（通义万相）"
    provider: "Alibaba"
    description: "阿里出品，prompt 上限 4500 token，文字渲染和排版最强"

    capabilities:
      max_prompt_length: "4500 token（三个模型里最能听的）"
      optimal_prompt_length: "200-500 字（吃得下长描述）"
      supported_languages: ["zh", "en", "12 语言"]
      text_rendering: "20+ 字体，12 语言，文字渲染最强"
      reference_images: true
      max_reference_images: 9
      negative_prompt: "negative_prompt 参数（最多 500 字符）"
      pricing: "约 0.16 元/张"

    prompt_format:
      formula: "[风格参数] + [详细场景描述] + [文字内容（如有）] + [排版要求]"
      style_tags:
        "<photography>": "摄影写实"
        "<portrait>": "人像优化"
        "<chinese painting>": "国画"
        "<watercolor>": "水彩"
        "<oil painting>": "油画"
        "<anime>": "动漫"
        "<3d render>": "3D 渲染"
      structure:
        - "风格参数（<photography> 等尖括号标签）"
        - "详细场景描述（越长越精确）"
        - "文字内容（海报标题/slogan/数据标注）"
        - "排版要求（位置、字号、颜色）"
      rules:
        - "风格参数必须放最前面"
        - "描述越详细越好——它真吃得下"
        - "相机型号+镜头写上去有效果"
        - "文字内容用引号包裹，排版位置写清楚"
        - "多参考图用文字说明每张的用途"
      separator: "，或换行（支持长文本自然分段）"
      max_detail_level: "极高——细节越多它越准"

    strengths:
      - "文字渲染独一档"
      - "复杂排版和信息图是舒适区"
      - "9 张参考图融合"
      - "价格最低，批量出图不心疼"
      - "长 prompt 不稀释"

    weaknesses:
      - "人像美感不如 Seedream"
      - "风格参数必须用尖括号标签，写错不生效"
      - "中文美学'味道'不如 Seedream 正"

    best_for:
      - "含文字的海报/信息图"
      - "复杂排版"
      - "多参考图融合"
      - "预算敏感/批量出图"

  seedream:
    model_id: "seedream_5"
    model_name: "Seedream 5.0（即梦）"
    provider: "ByteDance"
    description: "字节出品，人像美感最强，中文美学理解好"

    capabilities:
      versions:
        pro:
          resolution: "4K"
          reference_images: 10
          features: ["交互式编辑", "最高画质"]
        lite:
          resolution: "1080p"
          features: ["顺序生成", "漫画分镜", "网页搜索"]
      max_prompt_length: "无明确上限，但结构化比长度重要"
      optimal_prompt_length: "按 7 要素写满即可"
      supported_languages: ["zh", "en"]
      text_rendering: "一般（不如 Kolors 和 Qwen）"
      negative_prompt: "写在 7 要素的'约束'里"
      pricing: "约 0.3 元/张"

    prompt_format:
      formula: "主体 + 细节 + 动作 + 环境 + 风格 + 光线 + 质量 + 约束"
      seven_elements:
        主体: "谁/什么（一句话定义画面中心）"
        细节: "外貌特征（脸型/发型/服装/材质）"
        动作: "在做什么（姿态/手势/视线方向）"
        环境: "在哪（场景/天气/时间/前后景）"
        风格: "什么质感（写实摄影/电影质感/国画/水墨）"
        光线: "什么光（光源方向+色温+冷暖对比）"
        质量: "画质要求（高清/毛孔可见/肤质/纹理）"
        约束: "不要什么（无多余人物/无文字/无 logo）"
      structure:
        - "每个要素一行，用冒号分隔标签和内容"
        - "要素顺序固定——模型对位置敏感"
        - "约束放最后，当负面提示词用"
      rules:
        - "7 要素一个不能省——少一个它就自由发挥一个"
        - "要素之间用换行分隔，别挤成一段"
        - "光线要素必须写光源方向+色温，不能只写'好光'"
        - "质量要素写具体指标（毛孔/肤质/纹理），别写'高质量'"
        - "约束要素等价于负面提示词——该排除的都写这"
      separator: "换行 + 冒号标签"
      max_detail_level: "高——但结构化比堆细节重要"

    strengths:
      - "人物美感和摄影写实最强"
      - "中文美学理解好（传统/水墨/古风）"
      - "7 要素公式结构化程度高，可复现性好"
      - "参考图交互式编辑（Pro 版）"

    weaknesses:
      - "文字渲染弱（别用它做含文字的图）"
      - "比 Qwen 贵一倍"
      - "7 要素缺一个就翻车"
      - "真人面部有平台限制（I2V 时不上传真人照片）"

    best_for:
      - "写实人像"
      - "古风/国风"
      - "商业交稿"
      - "需要参考图交互式编辑"

# ============================================================
# 翻译规则：同一个创意意图 → 三个模型的 prompt 改写
# ============================================================
translation_rules:

  # 核心原则
  meta:
    kolors: "精简到骨头——中文短句，质量后缀收尾"
    qwen: "展开所有细节——风格标签开头，相机镜头写上去"
    seedream: "套 7 要素模板——一行一个要素，不省不混"

  # 通用翻译映射
  common_mappings:
    quality_suffix:
      kolors: "高清, 精细, 专业品质"
      qwen: "（不需要质量后缀——细节描述本身就是质量）"
      seedream: "质量：高清，毛孔可见，自然肤质"

    camera_lens:
      kolors: "（不写——Kolors 对镜头不敏感）"
      qwen: "Sony Venice 拍摄，85mm f/1.2，浅景深"
      seedream: "风格：写实摄影，电影质感"

    lighting:
      kolors: "暖色光 / 冷色光 / 自然光（一个词就够）"
      qwen: "光源方向 + 色温 + 环境反射 + 光晕效果（全展开）"
      seedream: "光线：[光源]从[方向]照射，环境[色温]光，[冷暖关系]"

    negative_prompt:
      kolors: "独立 negative prompt 参数提交"
      qwen: "negative_prompt 参数（≤500 字符）"
      seedream: "写在约束要素里"

# ============================================================
# 实战示例：同一个创意，三个模型的 prompt
# ============================================================
translation_examples:

  # 示例 1：雨夜便利店（用户指定场景）
  - scene: "雨夜便利店"
    creative_intent: "深夜，一个穿连帽衫的年轻人站在便利店落地窗前，手里捧着一杯热咖啡。便利店灯光是画面唯一的暖光源，外面是冷蓝色的雨夜。玻璃上有雨滴和雾气。整体氛围是孤独但不悲伤——一种安静的独处时刻。"

    kolors_prompt: |
      深夜便利店落地窗前，一个穿灰色连帽衫的年轻人双手捧着一杯热咖啡。
      便利店暖白灯光是画面唯一光源，窗外是冷蓝色雨夜。
      玻璃上有雨滴和薄雾。孤独但安静的氛围。
      高清，精细，专业品质。

    qwen_prompt: |
      <photography> 深夜，一个穿灰色棉质连帽衫的年轻人站在 24 小时便利店的落地玻璃窗前，
      双手捧着一杯外带热咖啡，杯口有白色蒸汽升起。
      他微微低头看着咖啡，表情平静，眼神柔和。
      便利店内部的暖白色荧光灯是画面唯一主光源，从左上方照射，
      在他脸上形成柔和的顶光，在咖啡杯上形成一道窄高光。
      落地窗外是深蓝色的雨夜，雨水沿玻璃外壁滑落，
      玻璃上有冷凝雾气，部分区域模糊透出对面停车场的轮廓。
      便利店货架在背景中虚化，瓶罐标签隐约可见。
      地面是便利店特有的白色瓷砖，反射着灯光。
      Fujifilm X-T5 拍摄，35mm f/1.4，中景，浅景深，窗外雨景奶油般化开。
      整体色调：暖白（内）与冷蓝（外）对比，暗角轻微。

    seedream_prompt: |
      主体：一个穿灰色连帽衫的年轻人，20 出头，短发，干净面容。
      细节：连帽衫是棉质微起球，袖口有咖啡渍。手指修长，指尖微红。
      动作：双手捧着外带纸杯咖啡，微微低头看杯中液面，嘴角放松。
      环境：深夜 24 小时便利店，落地玻璃窗，窗外冷蓝色雨夜，玻璃上有雨滴和雾气。
      风格：写实摄影，安静日常感，电影质感。
      光线：便利店暖白荧光灯从上方照射，唯一主光源。窗外无光，冷蓝环境反射。
      质量：高清，肤质自然，布料纹理可见，玻璃水珠清晰，咖啡蒸汽柔和。
      约束：无其他人物，无文字，无 logo，无多余物品。

  # 示例 2：废墟花园
  - scene: "废墟花园"
    creative_intent: "一座废弃的混凝土建筑被植物侵占，阳光从坍塌的屋顶洒入，灰尘在光柱中飘浮。自然与人工的对抗。"

    kolors_prompt: |
      废弃的混凝土建筑内部，屋顶坍塌一个大洞，阳光从洞口直射进来。
      光柱中灰尘飘浮。地面裂缝里长出野草和小花，藤蔓爬上墙壁。
      自然正在收回这座建筑。光影对比强烈。
      高清，精细，专业品质。

    qwen_prompt: |
      <photography> 一座废弃的粗野主义混凝土建筑内部，屋顶坍塌形成一个不规则的洞口，
      一束强烈的午后阳光从洞口直射下来，在布满碎屑的地面投下一个明亮的光斑。
      光柱中可以看到无数灰尘颗粒在缓慢飘浮。
      地面混凝土板开裂，裂缝里长出了蕨类植物和野草，
      一面墙壁被爬山虎和藤蔓覆盖了大半，绿色从底部向上蔓延。
      天花板裸露的钢筋上有锈迹，雨水渗入留下的水渍形成深色条纹。
      远处可以看到更多坍塌的房间，光线逐渐变暗。
      Hasselblad X2D 拍摄，21mm f/5.6，广角，f/8 深景深，全画面锐利。
      色调：混凝土灰+植物绿+阳光金，高对比度。

    seedream_prompt: |
      主体：一座废弃的粗野主义混凝土建筑内部。
      细节：天花板坍塌形成不规则洞口，裸露钢筋有锈迹，地面布满碎石和灰尘。
      动作：阳光从洞口直射形成光柱，灰尘在光柱中缓慢飘浮，裂缝中的野草微微摇曳。
      环境：废弃建筑内部，墙壁被藤蔓覆盖，远处更多坍塌的房间。
      风格：写实摄影，建筑废墟美学，自然与人工的对抗感。
      光线：午后阳光从屋顶洞口直射，形成明显光柱。环境暗，只有光斑区域明亮。
      质量：高清，混凝土纹理粗糙可见，灰尘颗粒清晰，植物叶脉细节。
      约束：无人物，无文字，无现代物品（手机/塑料等），无鲜艳人造色。

  # 示例 3：赛博集市
  - scene: "赛博集市"
    creative_intent: "未来感夜市摊位，霓虹灯招牌密集，蒸汽从地面升起，人群穿梭。拥挤、热闹、信息过载。"

    kolors_prompt: |
      未来感夜市，密集的霓虹灯招牌层层叠叠，粉的蓝的紫的。
      地面蒸汽升起，和霓虹光混在一起。人群穿梭在狭窄的通道里。
      拥挤热闹，信息过载。赛博朋克氛围。
      高清，精细，专业品质。

    qwen_prompt: |
      <photography> 未来亚洲城市的夜市小巷，两侧是密集的摊位和店铺，
      招牌层层叠叠——粉色、蓝色、紫色的霓虹灯管组成各种文字和图案，
      有些招牌是全息投影，在空气中悬浮旋转。
      地面排水沟升起白色蒸汽，和霓虹灯光混合形成彩色雾气。
      狭窄的通道里挤满了人——穿机能风外套的年轻人、端着一碗面的摊主、
      戴着 AR 眼镜的游客。摊位上摆满了烤串和未知的小吃，
      油烟和香料的气味几乎可以闻到。
      头顶是密密麻麻的电线和管道，偶尔有无人机低空飞过。
      ARRI Alexa Mini 拍摄，Anamorphic 镜头，24mm，f/2.8，
      镜头光晕水平拉伸，霓虹灯散景呈椭圆形。
      色调：高饱和霓虹+深暗阴影，teal and orange 底色。

    seedream_prompt: |
      主体：未来亚洲城市的夜市小巷，两侧密集摊位和店铺。
      细节：招牌层层叠叠（粉/蓝/紫霓虹），地面排水沟冒蒸汽，头顶电线和管道密布。
      动作：人群在狭窄通道中穿梭，摊主翻烤食物，无人机低空飞过，全息招牌旋转。
      环境：未来亚洲城市，夜晚，狭窄小巷，摊位拥挤，油烟弥漫。
      风格：写实摄影，赛博朋克美学，信息过载的视觉密度。
      光线：霓虹灯为主光源（粉/蓝/紫多色混合），蒸汽散射光线形成彩色雾气。无自然光。
      质量：高清，霓虹灯管细节清晰，蒸汽颗粒感，人物面部光影斑驳，地面湿反射。
      约束：无大面积空白区域，无白天光线，无现代品牌 logo，无极简构图。

# ============================================================
# 模型路由建议
# ============================================================
routing_hints:
  by_content_type:
    含中文文字: "kolors"
    写实人像: "seedream"
    海报信息图: "qwen"
    古风国风: "seedream"
    视频首帧_I2V: "kolors"
    批量出图: "qwen"
    本地部署: "kolors"
    商业交稿: "seedream"
    复杂排版: "qwen"
    多参考图融合: "qwen"

  by_budget:
    最低成本: "qwen（0.16 元/张）"
    中等成本: "seedream（0.3 元/张）"
    本地免费: "kolors（开源）"

  by_workflow_stage:
    概念验证: "qwen（便宜快速，长 prompt 试错）"
    正式出图: "seedream（质量最高）"
    I2V首帧: "kolors（和可灵视频同生态）"
    批量生产: "qwen（成本最低）"

# ============================================================
# 负面提示词适配
# ============================================================
negative_prompt_adapter:
  kolors:
    method: "独立 negative_prompt 参数"
    format: "和正面 prompt 一样用中文逗号分隔"
    example: "模糊, 低质量, 水印, 变形, 多余手指, 文字伪影"

  qwen:
    method: "negative_prompt 参数（≤500 字符）"
    format: "英文逗号分隔，英文为主"
    char_limit: 500
    example: "blurry, low quality, watermark, deformed, extra fingers, text artifacts, signature"

  seedream:
    method: "写在 7 要素的'约束'行"
    format: "约束：无XX，无XX，无XX"
    example: "约束：无多余人物，无文字，无 logo，无鲜艳人造色，无现代物品"

